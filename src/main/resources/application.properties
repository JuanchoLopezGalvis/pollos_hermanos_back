spring.application.name=pollos_hermanos_back
server.port=${SERVER_PORT:8081}

# PostgreSQL: la aplicación usa un rol de privilegios mínimos, sin permisos de DDL.
# El esquema se crea con los scripts SQL de la Fase 2, nunca desde Hibernate.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pollos_hermanos}
spring.datasource.username=${DB_USERNAME:pollos_app}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# MongoDB: solo el seguimiento diario del crecimiento de los lotes.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pollos_hermanos}
# Crea el índice único (lote, fecha) declarado en el documento SeguimientoCrecimiento.
spring.data.mongodb.auto-index-creation=true

# JWT: el secreto debe tener al menos 32 caracteres (HMAC-SHA256).
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# Correo (Java Mail Sender + Thymeleaf).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Orígenes permitidos para el frontend en Angular.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Superusuario inicial (equivalente a createsuperuser de Django). Se crea al arrancar
# solo si las tres variables están definidas y el usuario todavía no existe.
pollos.admin.usuario=${ADMIN_USUARIO:}
pollos.admin.correo=${ADMIN_CORREO:}
pollos.admin.contrasena=${ADMIN_CONTRASENA:}

# Pasarela de pagos Wompi, solo en ambiente de pruebas (sandbox): llaves pub_test_ y test_integrity_.
# Sin ellas, el pago en línea responde que la pasarela no está configurada.
pollos.wompi.llave-publica=${WOMPI_LLAVE_PUBLICA:}
pollos.wompi.secreto-integridad=${WOMPI_SECRETO_INTEGRIDAD:}
pollos.wompi.url-api=${WOMPI_URL_API:https://sandbox.wompi.co/v1}

# Marcado diario de la cartera vencida (segundo minuto hora día mes día-semana).
pollos.cartera.cron=${CARTERA_CRON:0 0 1 * * *}
